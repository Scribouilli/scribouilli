name: Build and Deploy
on: [pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: |
          npm pkg delete scripts.prepare
          npm ci
          npm run check

      - name: Test
        run: |
          npm pkg delete scripts.prepare
          npm ci
          npm run test
